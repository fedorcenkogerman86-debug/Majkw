<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marvel Cases — Симулятор открытия кейсов</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }

  body {
    background: #0a0a14;
    background-image: radial-gradient(circle at 20% 10%, rgba(139,0,0,0.25), transparent 40%),
                      radial-gradient(circle at 80% 80%, rgba(75,0,130,0.25), transparent 40%);
    background-attachment: fixed;
    color: #e0e0e0;
    min-height: 100vh;
    padding: 20px;
    animation: bgShift 20s ease infinite;
  }
  @keyframes bgShift {
    0%,100% { background-position: 0% 0%; }
    50% { background-position: 100% 100%; }
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 15px 25px;
    background: linear-gradient(90deg, #8b0000, #1a1a2e);
    border-radius: 12px;
    margin-bottom: 25px;
    box-shadow: 0 4px 25px rgba(255, 0, 0, 0.3);
    flex-wrap: wrap;
    gap: 10px;
    animation: headerGlow 4s ease-in-out infinite;
  }
  @keyframes headerGlow {
    0%,100% { box-shadow: 0 4px 25px rgba(255,0,0,0.3); }
    50% { box-shadow: 0 4px 40px rgba(255,0,0,0.6); }
  }

  header h1 {
    font-size: 24px;
    color: #fff;
    text-shadow: 0 0 12px #ff4444;
    letter-spacing: 3px;
  }

  .balance {
    font-size: 20px;
    font-weight: bold;
    color: #ffd700;
    background: rgba(0,0,0,0.5);
    padding: 10px 20px;
    border-radius: 8px;
    border: 1px solid #ffd700;
    text-shadow: 0 0 8px #ffd700;
    transition: 0.3s;
  }
  .balance.flash { transform: scale(1.15); box-shadow: 0 0 20px #ffd700; }

  h2.section { color:#fff; margin-bottom:15px; letter-spacing:1px; }

  /* СЕТКА КЕЙСОВ */
  .cases-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }

  .case-card {
    background: linear-gradient(145deg, #1e1e30, #12121e);
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.35s;
    border: 2px solid #333;
    position: relative;
    overflow: hidden;
  }

  .case-card::before {
    content:'';
    position:absolute; inset:0;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,0.08) 50%, transparent 70%);
    transform: translateX(-100%);
    transition: 0.6s;
  }
  .case-card:hover::before { transform: translateX(100%); }

  .case-card:hover {
    transform: translateY(-6px) scale(1.02);
    border-color: #ff4444;
    box-shadow: 0 10px 40px rgba(255, 68, 68, 0.5);
  }

  .case-card svg { width: 70px; height: 70px; margin-bottom: 10px; transition: 0.4s; filter: drop-shadow(0 0 6px rgba(255,68,68,0.5)); }
  .case-card:hover svg { transform: scale(1.1) rotate(-3deg); filter: drop-shadow(0 0 14px rgba(255,68,68,0.9)); }

  .case-card .case-name { font-size: 16px; font-weight: bold; margin-bottom: 8px; color: #fff; }
  .case-card .case-price { font-size: 14px; color: #ffd700; font-weight: bold; letter-spacing: 1px; }

  /* КНОПКИ */
  button {
    background: linear-gradient(90deg, #8b0000, #ff4444);
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
    font-weight: bold;
    transition: 0.3s;
    letter-spacing: 1px;
    position: relative;
    overflow: hidden;
  }
  button:hover { box-shadow: 0 0 20px rgba(255, 68, 68, 0.8); transform: translateY(-2px); }
  button:active { transform: translateY(0) scale(0.97); }
  button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  /* МОДАЛКА */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    padding: 20px;
    backdrop-filter: blur(4px);
  }
  .modal.active { display: flex; animation: fadeIn 0.3s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal-content {
    background: linear-gradient(145deg, #1a1a2e, #0d0d18);
    border-radius: 16px;
    padding: 30px;
    max-width: 720px;
    width: 100%;
    border: 2px solid #444;
    position: relative;
    max-height: 90vh;
    overflow-y: auto;
    animation: modalPop 0.35s cubic-bezier(0.17,0.89,0.32,1.28);
  }
  @keyframes modalPop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .modal-close {
    position: absolute; top: 12px; right: 15px;
    font-size: 26px; cursor: pointer; color: #888;
    background: none; padding: 0; width: 30px; height: 30px; line-height: 1;
  }
  .modal-close:hover { color: #ff4444; box-shadow: none; transform: none; }

  .modal-title { font-size: 22px; text-align: center; margin-bottom: 20px; color: #fff; letter-spacing: 1px; }

  /* РУЛЕТКА */
  .roulette-container {
    position: relative; overflow: hidden;
    border-radius: 10px; background: #0a0a14;
    border: 2px solid #333; margin-bottom: 20px; height: 150px;
    box-shadow: inset 0 0 30px rgba(0,0,0,0.8);
  }
  .roulette-track {
    display: flex; position: absolute; left: 0; top: 0; height: 100%;
    align-items: center; will-change: transform;
  }
  .roulette-item {
    min-width: 130px; height: 130px; margin: 0 5px; border-radius: 8px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 8px; font-size: 12px; text-align: center; flex-shrink: 0;
    border: 2px solid; font-weight: bold; background: rgba(0,0,0,0.4);
  }
  .roulette-item .ri-name { margin-top: 6px; line-height: 1.2; }

  .roulette-pointer {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    width: 3px; height: 100%; background: #ff4444; z-index: 10;
    box-shadow: 0 0 20px #ff4444; animation: pointerPulse 1s ease-in-out infinite;
  }
  @keyframes pointerPulse { 0%,100% { box-shadow: 0 0 15px #ff4444; } 50% { box-shadow: 0 0 30px #ff4444, 0 0 50px #ff4444; } }

  .roulette-pointer::before {
    content: ''; position: absolute; top: -14px; left: 50%; transform: translateX(-50%);
    width: 0; height: 0; border-left: 10px solid transparent; border-right: 10px solid transparent;
    border-top: 14px solid #ff4444; filter: drop-shadow(0 0 6px #ff4444);
  }

  /* РЕЗУЛЬТАТ */
  .result-box { text-align: center; padding: 20px; border-radius: 10px; margin-top: 15px; display: none; }
  .result-box.active { display: block; animation: resultIn 0.5s cubic-bezier(0.17,0.89,0.32,1.28); }
  @keyframes resultIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .result-card {
    display: inline-block; padding: 25px 40px; border-radius: 14px;
    border: 3px solid; margin: 10px 0; min-width: 240px;
  }
  .result-card .rc-name { font-size: 20px; font-weight: bold; margin: 10px 0; }
  .result-card .rc-rar { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.9; }
  .result-card .rc-price { color: #ffd700; font-size: 16px; margin-top: 8px; font-weight: bold; }

  /* ИНВЕНТАРЬ */
  .inventory-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 15px; flex-wrap: wrap; gap: 10px;
  }
  .inventory-header h2 { color: #fff; letter-spacing: 1px; }
  .inv-stats { color: #888; font-size: 14px; }

  .inventory-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px;
  }

  .inv-item {
    border-radius: 10px; padding: 14px 10px; text-align: center;
    font-size: 12px; border: 2px solid; background: rgba(0,0,0,0.35);
    transition: 0.3s; animation: itemIn 0.4s;
  }
  @keyframes itemIn { from { transform: scale(0.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .inv-item:hover { transform: translateY(-4px); }

  .inv-item .inv-name { font-weight: bold; margin-bottom: 6px; line-height: 1.3; }
  .inv-item .inv-rar { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; margin-bottom: 5px; }
  .inv-item .inv-price { color: #ffd700; font-size: 12px; font-weight: bold; }

  .empty-inv { text-align: center; padding: 50px; color: #555; font-style: italic; grid-column: 1/-1; }

  /* РЕДКОСТИ */
  .rar-common { color: #b0b0b0; border-color: #666; }
  .rar-uncommon { color: #4caf50; border-color: #4caf50; }
  .rar-rare { color: #2196f3; border-color: #2196f3; }
  .rar-epic { color: #9c27b0; border-color: #9c27b0; }
  .rar-legendary { color: #ff9800; border-color: #ff9800; box-shadow: 0 0 12px rgba(255,152,0,0.5); }
  .rar-mythic { color: #f44336; border-color: #f44336; box-shadow: 0 0 15px rgba(244,67,54,0.6); }

  .rar-infinity {
    color: #fff; border-color: transparent;
    background: linear-gradient(135deg, rgba(255,0,0,0.25), rgba(255,165,0,0.25), rgba(255,255,0,0.25), rgba(0,128,0,0.25), rgba(0,0,255,0.25), rgba(138,43,226,0.25));
    background-size: 400% 400%;
    animation: infinityShift 3s linear infinite;
    box-shadow: 0 0 20px rgba(255,0,255,0.6);
  }
  @keyframes infinityShift { 0% { background-position: 0% 50%; } 100% { background-position: 400% 50%; } }

  .rar-astral {
    color: #b0c4ff; border-color: #7b68ee;
    background: linear-gradient(135deg, rgba(123,104,238,0.25), rgba(0,191,255,0.25));
    background-size: 200% 200%;
    animation: astralShift 4s ease infinite;
    box-shadow: 0 0 20px rgba(123,104,238,0.7);
  }
  @keyframes astralShift {
    0%,100% { background-position: 0% 0%; box-shadow: 0 0 20px rgba(123,104,238,0.7); }
    50% { background-position: 100% 100%; box-shadow: 0 0 30px rgba(0,191,255,0.9); }
  }

  .rar-celestial {
    color: #fff8dc; border-color: #ffd700;
    background: linear-gradient(135deg, rgba(255,215,0,0.3), rgba(255,255,255,0.15));
    background-size: 200% 200%;
    animation: celestialShift 2.5s ease infinite;
    box-shadow: 0 0 25px rgba(255,215,0,0.8);
  }
  @keyframes celestialShift {
    0%,100% { background-position: 0% 0%; box-shadow: 0 0 25px rgba(255,215,0,0.8); }
    50% { background-position: 100% 100%; box-shadow: 0 0 40px rgba(255,255,255,1); }
  }

  .rar-singularity {
    color: #fff; border-color: #8a2be2;
    background: radial-gradient(circle at center, rgba(138,43,226,0.4), rgba(0,0,0,0.9));
    animation: singGlow 2s ease-in-out infinite;
    position: relative; overflow: hidden;
  }
  .rar-singularity::after {
    content:''; position:absolute; inset:0;
    background: radial-gradient(circle at 30% 30%, rgba(255,0,255,0.4), transparent 50%);
    animation: singSpark 3s ease-in-out infinite;
  }
  @keyframes singGlow {
    0%,100% { box-shadow: 0 0 30px rgba(138,43,226,1), 0 0 60px rgba(255,0,255,0.5); }
    50% { box-shadow: 0 0 50px rgba(255,0,255,1), 0 0 100px rgba(138,43,226,0.9); }
  }
  @keyframes singSpark {
    0%,100% { opacity: 0.4; } 50% { opacity: 1; }
  }

  .rar-primordial {
    color: #fff; border-color: transparent;
    background: linear-gradient(135deg, rgba(138,43,226,0.35), rgba(255,0,0,0.35), rgba(255,165,0,0.35), rgba(0,128,0,0.35), rgba(0,0,255,0.35), rgba(255,255,0,0.35));
    background-size: 500% 500%;
    animation: primShift 5s ease infinite;
    box-shadow: 0 0 30px rgba(255,0,255,0.8), 0 0 60px rgba(0,0,255,0.5);
  }
  @keyframes primShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  @media (max-width: 600px) {
    header h1 { font-size: 18px; }
    .balance { font-size: 16px; padding: 8px 14px; }
    .cases-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    .case-card svg { width: 50px; height: 50px; }
    .roulette-item { min-width: 100px; height: 110px; font-size: 10px; }
  }
</style>
</head>
<body>

<header>
  <h1>MARVEL CASES</h1>
  <div class="balance" id="balanceBox">StarkCoins: <span id="balance">3000</span> SC</div>
</header>

<h2 class="section">Кейсы</h2>
<div class="cases-grid" id="casesGrid"></div>

<h2 class="section" style="margin-top:30px;">Инвентарь</h2>
<div class="inventory-header">
  <div class="inv-stats">Предметов: <span id="invCount">0</span> | Стоимость: <span id="invValue" style="color:#ffd700;">0</span> SC</div>
  <button id="sellAllBtn" disabled>Продать всё</button>
</div>
<div class="inventory-grid" id="inventoryGrid"></div>

<div class="modal" id="openModal">
  <div class="modal-content">
    <button class="modal-close" onclick="closeModal()">×</button>
    <h2 class="modal-title" id="modalTitle">Открытие кейса</h2>

    <div id="rouletteSection">
      <div class="roulette-container">
        <div class="roulette-track" id="rouletteTrack"></div>
        <div class="roulette-pointer"></div>
      </div>
      <div style="text-align:center;">
        <button id="spinBtn">Открыть за <span id="spinPrice">100</span> SC</button>
      </div>
    </div>

    <div class="result-box" id="resultBox">
      <div style="color:#aaa; margin-bottom:10px;">Ты получил:</div>
      <div id="resultContent"></div>
      <div style="margin-top:20px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
        <button id="againBtn">Ещё раз</button>
        <button onclick="closeModal()" style="background: linear-gradient(90deg,#333,#555);">Закрыть</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ============================================================
   SVG ИКОНКИ ДЛЯ КЕЙСОВ
   ============================================================ */
const CASE_SVGS = {
  avengers: `<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="42" stroke="#ff4444" stroke-width="3" fill="rgba(139,0,0,0.3)"/><path d="M50 15 L58 38 L82 38 L62 52 L70 75 L50 61 L30 75 L38 52 L18 38 L42 38 Z" fill="#ffd700" stroke="#ff4444" stroke-width="1.5"/></svg>`,
  shield: `<svg viewBox="0 0 100 100" fill="none"><path d="M50 12 L82 25 L82 55 Q82 80 50 90 Q18 80 18 55 L18 25 Z" fill="rgba(0,80,160,0.35)" stroke="#2196f3" stroke-width="3"/><circle cx="50" cy="50" r="14" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M50 36 L54 46 L64 46 L56 53 L59 63 L50 57 L41 63 L44 53 L36 46 L46 46 Z" fill="#fff"/></svg>`,
  ironman: `<svg viewBox="0 0 100 100" fill="none"><path d="M50 15 Q70 15 75 40 L75 70 Q70 85 50 88 Q30 85 25 70 L25 40 Q30 15 50 15 Z" fill="rgba(200,30,30,0.4)" stroke="#ff4444" stroke-width="3"/><circle cx="40" cy="45" r="6" fill="#00e5ff"/><circle cx="60" cy="45" r="6" fill="#00e5ff"/><path d="M35 65 L65 65 L60 72 L40 72 Z" fill="#ffd700"/></svg>`,
  asgard: `<svg viewBox="0 0 100 100" fill="none"><path d="M50 10 L55 25 L70 22 L58 35 L65 50 L52 42 L40 55 L42 40 L28 32 L45 30 Z" fill="#ffd700" stroke="#ff9800" stroke-width="2"/><rect x="46" y="50" width="8" height="35" fill="#8b4513" stroke="#ffd700" stroke-width="1.5"/></svg>`,
  wakanda: `<svg viewBox="0 0 100 100" fill="none"><ellipse cx="50" cy="55" rx="28" ry="38" fill="rgba(75,0,130,0.4)" stroke="#9c27b0" stroke-width="3"/><path d="M50 25 L55 40 L70 40 L58 50 L62 65 L50 56 L38 65 L42 50 L30 40 L45 40 Z" fill="#c0c0c0" stroke="#9c27b0" stroke-width="1.5"/></svg>`,
  kamartaj: `<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="35" fill="none" stroke="#ff9800" stroke-width="3"/><circle cx="50" cy="50" r="22" fill="none" stroke="#ff4444" stroke-width="2" stroke-dasharray="6 4"/><circle cx="50" cy="50" r="9" fill="none" stroke="#ffd700" stroke-width="2.5"/><path d="M50 22 L50 8 M78 50 L92 50 M50 78 L50 92 M22 50 L8 50" stroke="#ffd700" stroke-width="2.5"/></svg>`,
  guardians: `<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="35" fill="rgba(30,60,120,0.4)" stroke="#00bfff" stroke-width="3"/><circle cx="35" cy="45" r="4" fill="#ffd700"/><circle cx="65" cy="45" r="4" fill="#ffd700"/><circle cx="50" cy="60" r="4" fill="#ffd700"/><path d="M20 30 Q50 10 80 30" stroke="#00bfff" stroke-width="2" fill="none"/></svg>`,
  multiverse: `<svg viewBox="0 0 100 100" fill="none"><circle cx="35" cy="45" r="22" fill="none" stroke="#9c27b0" stroke-width="2.5"/><circle cx="65" cy="45" r="22" fill="none" stroke="#2196f3" stroke-width="2.5"/><circle cx="50" cy="65" r="22" fill="none" stroke="#ff4444" stroke-width="2.5"/></svg>`,
  celestials: `<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" fill="rgba(255,215,0,0.15)" stroke="#ffd700" stroke-width="3"/><path d="M50 15 L58 42 L85 42 L63 58 L72 85 L50 68 L28 85 L37 58 L15 42 L42 42 Z" fill="#ffd700" stroke="#fff" stroke-width="1.5"/></svg>`,
  singularity: `<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="38" fill="url(#singGrad)" stroke="#8a2be2" stroke-width="3"/><defs><radialGradient id="singGrad"><stop offset="0%" stop-color="#ff00ff"/><stop offset="50%" stop-color="#8a2be2"/><stop offset="100%" stop-color="#000"/></radialGradient></defs><circle cx="50" cy="50" r="8" fill="#fff"/><ellipse cx="50" cy="50" rx="35" ry="10" fill="none" stroke="#ff00ff" stroke-width="1.5" opacity="0.7"/></svg>`
};

/* ============================================================
   КЕЙСЫ
   ============================================================ */
const CASES = [
  { id:0, name:'Кейс Мстителей',       svg: CASE_SVGS.avengers,    price: 100,     rarityBias: 0 },
  { id:1, name:'Кейс Щ.И.Т.а',          svg: CASE_SVGS.shield,      price: 500,     rarityBias: 1 },
  { id:2, name:'Кейс Железного Человека', svg: CASE_SVGS.ironman,   price: 1000,    rarityBias: 2 },
  { id:3, name:'Кейс Асгарда',          svg: CASE_SVGS.asgard,      price: 5000,    rarityBias: 3 },
  { id:4, name:'Кейс Ваканды',          svg: CASE_SVGS.wakanda,     price: 10000,   rarityBias: 4 },
  { id:5, name:'Кейс Камар-Таджа',      svg: CASE_SVGS.kamartaj,    price: 50000,   rarityBias: 5 },
  { id:6, name:'Кейс Стражей Галактики', svg: CASE_SVGS.guardians,  price: 100000,  rarityBias: 6 },
  { id:7, name:'Кейс Мультивселенной',  svg: CASE_SVGS.multiverse,  price: 500000,  rarityBias: 7 },
  { id:8, name:'Кейс Небожителей',      svg: CASE_SVGS.celestials,  price: 1000000, rarityBias: 8 },
  { id:9, name:'Кейс Сингулярности',    svg: CASE_SVGS.singularity, price: 5000000, rarityBias: 9 }
];

/* ============================================================
   РЕДКОСТИ
   ============================================================ */
const RARITIES = {
  common:      { name:'Обычное',        class:'rar-common',      mult: 0.15 },
  uncommon:    { name:'Необычное',      class:'rar-uncommon',    mult: 0.4  },
  rare:        { name:'Редкое',         class:'rar-rare',        mult: 0.9  },
  epic:        { name:'Эпическое',      class:'rar-epic',        mult: 2.5  },
  legendary:   { name:'Легендарное',    class:'rar-legendary',   mult: 7    },
  mythic:      { name:'Мифическое',     class:'rar-mythic',      mult: 20   },
  infinity:    { name:'Бесконечность',  class:'rar-infinity',    mult: 60   },
  astral:      { name:'Астральное',     class:'rar-astral',      mult: 150  },
  celestial:   { name:'Небожитель',     class:'rar-celestial',   mult: 400  },
  singularity: { name:'Сингулярность',  class:'rar-singularity', mult: 1500 },
  primordial:  { name:'Первородное',    class:'rar-primordial',  mult: 5000 }
};

const RARITY_ORDER = ['common','uncommon','rare','epic','legendary','mythic','infinity','astral','celestial','singularity','primordial'];

/* ============================================================
   ПРЕДМЕТЫ ПО КЕЙСАМ
   ============================================================ */
const CASE_ITEMS = {
  0: { // Мстителей
    common:      ['Пистолет агента', 'Рация Щ.И.Т.а', 'Тактический нож'],
    uncommon:    ['Лук Хоукайя', 'Клинки Чёрной Вдовы', 'Костюм Муравья'],
    rare:        ['Щит Капитана Америки', 'Мьёльнир', 'Репульсор'],
    epic:        ['Костюм Соколиного Глаза', 'Перчатка Халка'],
    legendary:   ['Костюм Капитана Америки', 'Полный Мьёльнир'],
    mythic:      ['Квантовый костюм'],
    infinity:    ['Мьёльнир Одина'],
    astral:      ['Сила Мстителей'],
    celestial:   ['Гнев Мстителей'],
    singularity: ['Перчатка Мстителя']
  },
  1: { // Щ.И.Т.а

/* ============================================================
   ШАНСЫ ВЫПАДЕНИЯ (по индексу кейса)
   ============================================================ */
function getChances(caseId) {
  const bias = caseId;
  const c = {
    common:      Math.max(10, 40 - bias * 2),
    uncommon:    Math.max(15, 30 - bias * 0.5),
    rare:        18,
    epic:        8 + bias * 0.1,
    legendary:   3 + bias * 0.15,
    mythic:      0.7 + bias * 0.12,
    infinity:    0.25 + bias * 0.06,
    astral:      0.04 + bias * 0.012,
    celestial:   0.009 + bias * 0.005,
    singularity: 0.001 + bias * 0.002,
    primordial:  0
  };
  // Для 8-9 кейсов добавляем primordial и сдвигаем веса
  if (caseId >= 7) {
    c.primordial = 0.0005 + (caseId - 7) * 0.002;
    c.common = Math.max(8, c.common - 5);
  }
  // Корректировка суммарного веса к 100 (приблизительно, для плавности)
  const sum = Object.values(c).reduce((a,b)=>a+b,0);
  for (const k in c) c[k] = c[k] / sum * 100;
  return c;
}

/* ============================================================
   ЛОГИКА
   ============================================================ */
let balance = parseInt(localStorage.getItem('marvel_balance') || '3000');
let inventory = JSON.parse(localStorage.getItem('marvel_inventory') || '[]');
let currentCase = null;
let spinning = false;

const $ = id => document.getElementById(id);

function save() {
  localStorage.setItem('marvel_balance', balance);
  localStorage.setItem('marvel_inventory', JSON.stringify(inventory));
}

function updateBalanceUI(flash = false) {
  $('balance').textContent = balance.toLocaleString('ru-RU');
  if (flash) {
    const b = $('balanceBox');
    b.classList.add('flash');
    setTimeout(() => b.classList.remove('flash'), 300);
  }
}

function renderCases() {
  const grid = $('casesGrid');
  grid.innerHTML = '';
  CASES.forEach(c => {
    const el = document.createElement('div');
    el.className = 'case-card';
    el.innerHTML = `${c.svg}<div class="case-name">${c.name}</div><div class="case-price">${c.price.toLocaleString('ru-RU')} SC</div>`;
    el.onclick = () => openCase(c);
    grid.appendChild(el);
  });
}

function renderInventory() {
  const grid = $('inventoryGrid');
  const count = $('invCount');
  const value = $('invValue');
  const sellBtn = $('sellAllBtn');

  grid.innerHTML = '';
  if (inventory.length === 0) {
    grid.innerHTML = '<div class="empty-inv">Инвентарь пуст. Открывай кейсы!</div>';
  } else {
    // Сортируем по редкости (от топ к обычным)
    const sorted = [...inventory].sort((a,b) => RARITY_ORDER.indexOf(b.rarity) - RARITY_ORDER.indexOf(a.rarity));
    sorted.forEach((it, idx) => {
      const el = document.createElement('div');
      el.className = `inv-item ${RARITIES[it.rarity].class}`;
      el.innerHTML = `<div class="inv-name">${it.name}</div><div class="inv-rar">${RARITIES[it.rarity].name}</div><div class="inv-price">${it.price.toLocaleString('ru-RU')} SC</div>`;
      el.style.animationDelay = (idx * 0.02) + 's';
      grid.appendChild(el);
    });
  }

  const total = inventory.reduce((s,it) => s + it.price, 0);
  count.textContent = inventory.length;
  value.textContent = total.toLocaleString('ru-RU');
  sellBtn.disabled = inventory.length === 0;
}

function pickRarity(caseId) {
  const chances = getChances(caseId);
  const roll = Math.random() * 100;
  let acc = 0;
  for (const r of RARITY_ORDER) {
    acc += chances[r] || 0;
    if (roll <= acc) return r;
  }
  return 'common';
}

function pickItem(caseId, rarity) {
  const pool = CASE_ITEMS[caseId][rarity];
  if (!pool || pool.length === 0) return null;
  const name = pool[Math.floor(Math.random() * pool.length)];
  const price = Math.round(CASES[caseId].price * RARITIES[rarity].mult);
  return { name, rarity, price, caseId };
}

function openCase(c) {
  currentCase = c;
  $('modalTitle').textContent = c.name;
  $('spinPrice').textContent = c.price.toLocaleString('ru-RU');
  $('rouletteSection').style.display = 'block';
  $('resultBox').classList.remove('active');
  $('spinBtn').disabled = balance < c.price;
  buildRouletteTrack(c);
  $('openModal').classList.add('active');
}

function buildRouletteTrack(c) {
  const track = $('rouletteTrack');
  track.innerHTML = '';
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';
  // 40 случайных предметов
  for (let i = 0; i < 40; i++) {
    const rar = pickRarity(c.id);
    const it = pickItem(c.id, rar) || { name:'—', rarity: rar };
    const el = document.createElement('div');
    el.className = `roulette-item ${RARITIES[rar].class}`;
    el.innerHTML = `<div class="ri-name">${it.name}</div>`;
    track.appendChild(el);
  }
}

function closeModal() {
  if (spinning) return;
  $('openModal').classList.remove('active');
}

function spin() {
  if (spinning) return;
  const c = currentCase;
  if (balance < c.price) return;
  balance -= c.price;
  save();
  updateBalanceUI(true);

  spinning = true;
  $('spinBtn').disabled = true;
  $('resultBox').classList.remove('active');

  // Определяем выигрыш
  const winRar = pickRarity(c.id);
  const winItem = pickItem(c.id, winRar);

  // Строим новую ленту
  const track = $('rouletteTrack');
  track.innerHTML = '';
  track.style.transition = 'none';
  track.style.transform = 'translateX(0)';

  const itemWidth = 140; // 130 + 2*5 margin
  const totalItems = 50;
  const winIndex = 42; // где остановится

  for (let i = 0; i < totalItems; i++) {
    let rar, item;
    if (i === winIndex) {
      rar = winRar;
      item = winItem;
    } else {
      rar = pickRarity(c.id);
      item = pickItem(c.id, rar) || { name:'—', rarity: rar };
    }
    const el = document.createElement('div');
    el.className = `roulette-item ${RARITIES[rar].class}`;
    el.innerHTML = `<div class="ri-name">${item.name}</div>`;
    track.appendChild(el);
  }

  // Позиция остановки: центр контейнера минус позиция элемента
  const container = track.parentElement;
  const containerCenter = container.offsetWidth / 2;
  const targetX = winIndex * itemWidth + itemWidth/2 - containerCenter;

  // Небольшой рандом внутри элемента
  const jitter = (Math.random() - 0.5) * (itemWidth * 0.5);

  requestAnimationFrame(() => {
    track.style.transition = 'transform 5s cubic-bezier(0.15, 0.75, 0.25, 1)';
    track.style.transform = `translateX(${-(targetX + jitter)}px)`;

    setTimeout(() => {
      spinning = false;
      showResult(winItem);
    }, 5100);
  });
}

function showResult(item) {
  const box = $('resultBox');
  const cont = $('resultContent');
  const rar = RARITIES[item.rarity];
  cont.innerHTML = `
    <div class="result-card ${rar.class}">
      <div class="rc-rar">${rar.name}</div>
      <div class="rc-name">${item.name}</div>
      <div class="rc-price">${item.price.toLocaleString('ru-RU')} SC</div>
    </div>`;
  box.classList.add('active');
  $('spinBtn').disabled = balance < currentCase.price;

  // Добавляем в инвентарь
  inventory.push(item);
  save();
  renderInventory();
  updateBalanceUI();
}

// Обработчики
$('spinBtn').onclick = spin;
$('againBtn').onclick = () => {
  if (balance < currentCase.price) return;
  $('resultBox').classList.remove('active');
  $('rouletteSection').style.display = 'block';
  $('spinBtn').disabled = false;
  buildRouletteTrack(currentCase);
  spin();
};

$('sellAllBtn').onclick = () => {
  if (inventory.length === 0) return;
  if (!confirm(`Продать все предметы (${inventory.length} шт.)?`)) return;
  const total = inventory.reduce((s,it) => s + it.price, 0);
  balance += total;
  inventory = [];
  save();
  updateBalanceUI(true);
  renderInventory();
};

// Инициализация
renderCases();
renderInventory();
updateBalanceUI();
</script>
